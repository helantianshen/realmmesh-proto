// 玩家账户认证：可信游戏服提交注册、登录和自助改密请求，并订阅账户变更通知
// 服务器凭据通过 gRPC metadata 携带，不在消息中重复传递或返回玩家令牌

syntax = "proto3";

package realmmesh.auth.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/helantianshen/realmmesh-server/gen/auth/v1;authv1";

// AuthService 校验玩家账户，当前连接的登录状态由游戏服维护
// 每次调用均要求有效服务器凭据，密码和完整请求不得写入日志
service AuthService {
  // Register 创建普通账户，只有持久化成功才返回身份
  // 游戏服收到成功结果后，将发起注册的本次连接标记为已登录
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Login 验证密码并提交失败计数或休息状态，再返回本次认证结果
  // 密码错误、未注册与休息期属于正常业务结果，不作为 gRPC 错误返回
  rpc Login(LoginRequest) returns (LoginResponse);

  // ChangePassword 验证旧密码后修改密码，与登录共用失败次数和休息期
  // 仅允许已登录连接发起；提交成功后广播变更，发起连接也须清除认证并退出
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  // SubscribeAccountEvents 订阅中心提交成功后的账户变更，仅推送在线通知
  // 建流及每次发送均校验服务器凭据，断线期间的事件不保存、不补发
  rpc SubscribeAccountEvents(SubscribeAccountEventsRequest) returns (stream AccountEvent);
}

// SubscribeAccountEventsRequest 订阅全部账户变更，不接受玩家或服务器筛选
// 服务器身份来自 metadata，不传递游标、历史事件编号或玩家在线列表
message SubscribeAccountEventsRequest {}

// AccountEventReason 决定游戏服向被踢出玩家显示的原因
// 零值和未知值不是有效通知，接收方不得据此执行踢出
enum AccountEventReason {
  ACCOUNT_EVENT_REASON_UNSPECIFIED = 0; // 未指定原因，中心不得作为正常事件发送
  ACCOUNT_EVENT_REASON_PASSWORD_CHANGED = 1; // 密码已变更，在线玩家需要重新登录
  ACCOUNT_EVENT_REASON_ACCOUNT_DELETED = 2; // 账户已逻辑删除，在线玩家需要断开连接
}

// AccountEvent 通知游戏服撤销匹配在线玩家的认证并踢出，不代表中心维护玩家会话
// 消息不包含密码、凭据或令牌；重复通知仅对处理时仍在线的匹配玩家生效
message AccountEvent {
  // 账户保存的原始大小写名字，游戏服按 ASCII 忽略大小写匹配在线玩家
  string player_name = 1;

  // 已提交的账户变更原因，不用于撤销 HTTP JWT
  AccountEventReason reason = 2;
}

// RegisterRequest 使用当前游戏连接的真实名字注册，不接受客户端指定其他主体
message RegisterRequest {
  // 玩家名字为 3–16 位 ASCII 字母、数字或下划线，忽略大小写唯一
  string player_name = 1;

  // 原始密码为 6–12 位字母、数字或 $%&@#^*!，不得持久保存在游戏服
  string password = 2;
}

// RegisterResponse 表示普通账户已创建，不代表中心建立了在线会话
message RegisterResponse {
  // 中心生成的正数雪花主键，不是 Minecraft UUID
  int64 user_id = 1;

  // 账户保存的原始大小写名字
  string player_name = 2;
}

// LoginRequest 以当前连接的名字登录，中心按忽略大小写后的名字共享失败状态
message LoginRequest {
  // 玩家名字规则与注册一致，不能用名字大小写变化绕过休息期
  string player_name = 1;

  // 原始密码，休息期内不校验；非休息账户的格式错误密码也计为失败
  string password = 2;
}

// LoginStatus 区分认证结果，零值与无法识别的值均不得视作登录成功
enum LoginStatus {
  LOGIN_STATUS_UNSPECIFIED = 0;    // 未指定结果，中心不得将其作为正常业务结果发送
  LOGIN_STATUS_SUCCEEDED = 1;      // 密码验证成功，失败次数已清零
  LOGIN_STATUS_UNREGISTERED = 2;   // 账户不存在或已删除，不计失败次数
  LOGIN_STATUS_WRONG_PASSWORD = 3; // 密码错误但未达到阈值，仍可尝试
  LOGIN_STATUS_COOLING_DOWN = 4;   // 已进入或仍处于休息期，本次连接需要被踢出
}

// LoginResponse 只有在中心业务状态成功提交后才返回
// 仅 SUCCEEDED 允许游戏服将发起请求的本次连接标记为已登录
message LoginResponse {
  LoginStatus status = 1; // 本次认证的业务结果

  // 已存在账户的主键，UNREGISTERED 时为 0；返回身份不等于认证成功
  int64 user_id = 2;

  // 账户保存的原始大小写名字，UNREGISTERED 时为空
  string player_name = 3;

  // WRONG_PASSWORD 时为触发休息前剩余的失败次数
  // SUCCEEDED 时为清零后的中心失败阈值，其余状态为 0
  int64 remaining_attempts = 4;

  // 仅 COOLING_DOWN 时设置，表示中心记录的绝对截止时刻
  // 休息期内再次请求必须沿用原截止时间，不能延长
  google.protobuf.Timestamp cooldown_until = 5;

  // 仅 COOLING_DOWN 时为正数，按中心本次判断时刻向上取整的剩余秒数
  // 网络传输会消耗时间，此值用于提示，不是游戏服独立重算认证策略的依据
  int64 retry_after_seconds = 6;

  // 仅 COOLING_DOWN 时为 true，游戏服每次收到均应踢出发起请求的本次连接
  bool kick = 7;
}

// ChangePasswordRequest 为当前已登录连接自助改密，不支持指定其他账户或管理员重置
// 游戏服先确认两次新密码一致，中心独立验证新密码格式及旧密码
message ChangePasswordRequest {
  // 当前真实连接的玩家名字，规则与登录一致，不接受客户端指定其他主体
  string player_name = 1;

  // 原始旧密码；非休息账户提交格式错误的旧密码也计为失败
  string old_password = 2;

  // 原始新密码，规则与注册一致；格式错误不计失败次数，不保存到游戏服
  string new_password = 3;
}

// ChangePasswordStatus 区分改密业务结果，零值和未知值均不能视作成功
enum ChangePasswordStatus {
  CHANGE_PASSWORD_STATUS_UNSPECIFIED = 0; // 未指定结果，中心不得作为正常业务结果发送
  CHANGE_PASSWORD_STATUS_SUCCEEDED = 1; // 新密码及失败次数清零已提交，需要退出后重新登录
  CHANGE_PASSWORD_STATUS_UNREGISTERED = 2; // 账户不存在或已删除，不计数，清除本地认证并退出
  CHANGE_PASSWORD_STATUS_WRONG_PASSWORD = 3; // 旧密码错误但未达到共享阈值，仍可尝试
  CHANGE_PASSWORD_STATUS_COOLING_DOWN = 4; // 已进入或仍处于共享休息期，本次连接需要被踢出
}

// ChangePasswordResponse 在密码变更或失败状态提交成功后返回，不授予登录状态
// 成功响应与账户变更通知可能先后到达，两者均要求清除认证并退出
message ChangePasswordResponse {
  ChangePasswordStatus status = 1; // 本次改密的业务结果

  // WRONG_PASSWORD 时为触发休息前剩余次数，SUCCEEDED 时为清零后的失败阈值
  // 其余状态为 0，与登录读取和修改同一份持久化失败状态
  int64 remaining_attempts = 2;

  // 仅 COOLING_DOWN 时设置，沿用中心绝对截止时刻，再次请求不延长
  google.protobuf.Timestamp cooldown_until = 3;

  // 仅 COOLING_DOWN 时为正数，中心向上取整的剩余秒数，仅供提示
  int64 retry_after_seconds = 4;

  // SUCCEEDED、UNREGISTERED 和 COOLING_DOWN 时为 true，每次收到均处理本次连接
  // WRONG_PASSWORD 时为 false；踢出文案由 status 决定
  bool kick = 5;
}
